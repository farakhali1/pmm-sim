[package]
name = "humidifi-rpc"
version = "0.1.0"
edition = "2024"
description = "Sample crate: build & simulate direct HumidiFi / GoonFi / SolFi swaps over RPC"
publish = false

[[bin]]
name = "humidifi-rpc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive", "env"] }
eyre = "0.6.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
solana-client = "~3.1"
solana-commitment-config = "~3.1"
solana-sdk = "3.0.0"
solana-transaction-status = "~3.1"
spl-associated-token-account = "8.0.0"
spl-token = "9.0.0"
