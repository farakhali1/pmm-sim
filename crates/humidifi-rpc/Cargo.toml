[package]
name = "humidifi-rpc"
version = "0.1.0"
edition = "2024"
description = "Sample crate: build & simulate direct HumidiFi v1/v2/v3 swaps over RPC"
publish = false

[[bin]]
name = "humidifi-rpc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive", "env"] }
eyre = "0.6.12"
magnus-shared = { git = "https://git@github.com/limechain/magnus.git", branch = "extend-router-ixs" }
pmm-sim = { path = "../.." }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
solana-client = "~3.1"
solana-commitment-config = "~3.1"
solana-sdk = "3.0.0"
spl-associated-token-account = "8.0.0"
spl-token = "9.0.0"
